name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/android-app

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform and NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libglib2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and check frontend
        run: npm run build

      - name: Check Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Initialize Android project
        run: npm run tauri:android:init

      - name: Build installable APK
        run: npm run tauri:android:build
        env:
          CARGO_PROFILE_DEV_CODEGEN_UNITS: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_DEV_INCREMENTAL: "false"
          CARGO_PROFILE_DEV_LTO: "true"
          CARGO_PROFILE_DEV_OPT_LEVEL: "z"
          CARGO_PROFILE_DEV_PANIC: "abort"
          CARGO_PROFILE_DEV_STRIP: "symbols"

      - name: Collect APK and checksum
        shell: bash
        run: |
          mkdir -p android-artifacts
          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$apk_path"
          apk_output="android-artifacts/Expense-Tracker_0.2.0_arm64-debug.apk"
          cp "$apk_path" "$apk_output"
          test "$(stat -c %s "$apk_output")" -lt "$((100 * 1024 * 1024))"
          cd android-artifacts
          sha256sum *.apk > SHA256SUMS

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-arm64-debug
          if-no-files-found: error
          path: android-artifacts/
